<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>SVG → STL matrici embosser</title>
<style>
body{font-family:system-ui,sans-serif;margin:20px;background:#111;color:#eee}
.panel{max-width:1060px;margin:auto;background:#1c1c1c;padding:18px;border-radius:10px}
label{display:block;margin-top:10px;font-size:14px}
input,select,button{padding:7px;margin-top:4px;font-size:14px}
button{background:#2f80ed;color:white;border:0;border-radius:6px;cursor:pointer}
button:disabled{background:#555;cursor:not-allowed}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>div{flex:1;min-width:180px}
#preview{width:100%;height:360px;margin-top:16px;border-radius:8px;background:#222}
#status{margin-top:10px;font-size:14px;color:#9fd49f;min-height:40px}
</style>
</head>
<body>
<div class="panel">
<h1>SVG → coppia di matrici STL per embosser</h1>
<input type="file" id="svgFile" accept=".svg">
<div class="row">
<div><label>Piastra L × H [mm]</label><input id="plateW" type="number" value="100" min="30" step="1"><input id="plateH" type="number" value="70" min="30" step="1"></div>
<div><label>Spessore matrici [mm]</label><input id="baseThickness" type="number" value="4" min="2" step="0.5"></div>
<div><label>Altezza rilievo [mm]</label><input id="reliefHeight" type="number" value="0.8" min="0.3" max="2" step="0.1"></div>
</div>
<div class="row">
<div><label>Spessore carta [mm]</label><input id="paperThickness" type="number" value="0.12" min="0.05" max="1" step="0.01"></div>
<div><label>Gioco verticale [mm]</label><input id="verticalClearance" type="number" value="0.10" min="0" max="0.5" step="0.01"></div>
<div><label>Gioco laterale [mm]</label><input id="lateralClearance" type="number" value="0.10" min="0" max="0.5" step="0.01"></div>
</div>
<div class="row">
<div><label>Larghezza disegno [mm]</label><input id="artWidth" type="number" value="60" min="5" step="1"></div>
<div><label>Perne: lato × altezza [mm]</label><input id="pinSize" type="number" value="3" min="2" max="6" step="0.5"><input id="pinHeight" type="number" value="4" min="2" max="10" step="0.5"></div>
<div><label>Posizione disegno</label><select id="align"><option value="center">Centrato</option><option value="top">In alto</option><option value="bottom">In basso</option></select></div>
</div>
<div class="row">
<div><label>&nbsp;</label><button id="exportMale" disabled>Esporta positiva STL</button><button id="exportFemale" disabled>Esporta negativa STL</button></div>
</div>
<canvas id="preview"></canvas>
<div id="status">Carica un SVG. Questa versione funziona anche aprendo direttamente il file HTML.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let polygons=[];
let bounds=null;
let maleTriangles=[];
let femaleTriangles=[];

function svgToPolygons(svgText){
const parser=new DOMParser();
const doc=parser.parseFromString(svgText,'image/svg+xml');
const svg=doc.querySelector('svg');
if(!svg)throw new Error('File SVG non valido.');
const hidden=document.createElement('div');
hidden.style.position='fixed';hidden.style.left='-9999px';hidden.style.top='-9999px';
document.body.appendChild(hidden);
const liveSvg=document.createElementNS('http://www.w3.org/2000/svg','svg');
liveSvg.setAttribute('width','1000');liveSvg.setAttribute('height','1000');
liveSvg.innerHTML=svg.innerHTML;
hidden.appendChild(liveSvg);
const paths=[...liveSvg.querySelectorAll('path')];
if(!paths.length)throw new Error('Nessun tracciato SVG trovato.');
const result=[];
let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
for(const original of paths){
const fill=(original.getAttribute('fill')||'black').toLowerCase();
if(fill==='none')continue;
const d=original.getAttribute('d')||'';
const parts=d.split(/(?=[Mm])/).filter(x=>x.trim());
for(const part of parts){
const path=document.createElementNS('http://www.w3.org/2000/svg','path');
path.setAttribute('d',part);
liveSvg.appendChild(path);
const length=path.getTotalLength();
if(length<0.01)continue;
const samples=Math.max(24,Math.min(600,Math.round(length/2)));
const points=[];
for(let i=0;i<samples;i++){
const p=path.getPointAtLength(length*i/samples);
points.push({x:p.x,y:p.y});
minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);
maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y);
}
result.push(points);
liveSvg.removeChild(path);
}
}
document.body.removeChild(hidden);
if(!result.length)throw new Error('Nessuna forma riempita trovata nell’SVG.');
return{polygons:result,bounds:{minX,minY,maxX,maxY}};
}

function transformPoint(p,bounds,s,expansion){
const svgW=bounds.maxX-bounds.minX;
const svgH=bounds.maxY-bounds.minY;
const width=s.artWidth+expansion;
const scale=width/svgW;
const height=svgH*scale;
let x=(p.x-bounds.minX)*scale-width/2;
let y=-((p.y-bounds.minY)*scale);
if(s.align==='center')y+=height/2;
else if(s.align==='top')y+=s.plateH/2-8-height/2;
else y+=-s.plateH/2+8+height/2;
return{x,y};
}

function addTriangle(triangles,a,b,c){
const ab={x:b.x-a.x,y:b.y-a.y,z:b.z-a.z};
const ac={x:c.x-a.x,y:c.y-a.y,z:c.z-a.z};
const n={x:ab.y*ac.z-ab.z*ac.y,y:ab.z*ac.x-ab.x*ac.z,z:ab.x*ac.y-ab.y*ac.x};
const len=Math.hypot(n.x,n.y,n.z)||1;
triangles.push({normal:{x:n.x/len,y:n.y/len,z:n.z/len},a,b,c});
}

function addQuad(triangles,a,b,c,d){
addTriangle(triangles,a,b,c);
addTriangle(triangles,a,c,d);
}

function addCap(triangles,outer,holes,z,up){
const shape=new THREE.Shape(outer.map(p=>new THREE.Vector2(p[0],p[1])));
for(const hole of holes||[]){
shape.holes.push(new THREE.Path(hole.map(p=>new THREE.Vector2(p[0],p[1]))));
}
const geometry=new THREE.ShapeGeometry(shape);
const position=geometry.attributes.position;
for(let i=0;i<position.count;i+=3){
const a={x:position.getX(i),y:position.getY(i),z:z};
const b={x:position.getX(i+1),y:position.getY(i+1),z:z};
const c={x:position.getX(i+2),y:position.getY(i+2),z:z};
if(up)addTriangle(triangles,a,b,c);else addTriangle(triangles,a,c,b);
}
geometry.dispose();
}

function addPrism(triangles,outer,zBottom,zTop){
addCap(triangles,outer,[],zBottom,false);
addCap(triangles,outer,[],zTop,true);
for(let i=0;i<outer.length;i++){
const a=outer[i],b=outer[(i+1)%outer.length];
addQuad(triangles,{x:a[0],y:a[1],z:zBottom},{x:b[0],y:b[1],z:zBottom},{x:b[0],y:b[1],z:zTop},{x:a[0],y:a[1],z:zTop});
}
}

function addBox(triangles,cx,cy,z0,w,h,d){
const x0=cx-w/2,x1=cx+w/2,y0=cy-h/2,y1=cy+h/2,z1=z0+d;
const bottom=[{x:x0,y:y0,z:z0},{x:x1,y:y0,z:z0},{x:x1,y:y1,z:z0},{x:x0,y:y1,z:z0}];
const top=[{x:x0,y:y0,z:z1},{x:x1,y:y0,z:z1},{x:x1,y:y1,z:z1},{x:x0,y:y1,z:z1}];
addCap(triangles,bottom.map(p=>[p.x,p.y]),[],z0,false);
addCap(triangles,top.map(p=>[p.x,p.y]),[],z1,true);
for(let i=0;i<4;i++){
const a=bottom[i],b=bottom[(i+1)%4],c=top[(i+1)%4],dd=top[i];
addQuad(triangles,a,b,c,dd);
}
}

function buildPositive(data,s){
const triangles=[];
addBox(triangles,0,0,0,s.plateW,s.plateH,s.baseThickness);
for(const polygon of data.polygons){
const outer=polygon.map(p=>{const q=transformPoint(p,data.bounds,s,0);return[q.x,q.y];});
addPrism(triangles,outer,s.baseThickness,s.baseThickness+s.reliefHeight);
}
const pocketSize=s.pinSize+0.1;
for(const x of[-1,1]){
const px=x*(s.plateW/2-7);
addBox(triangles,px,0,-0.01,pocketSize,pocketSize,s.pinHeight+0.02);
}
return triangles;
}

function buildNegative(data,s){
const triangles=[];
const cavityDepth=s.paperThickness+s.verticalClearance;
const cavityBottom=s.baseThickness-cavityDepth;
const outerRect=[[-s.plateW/2,-s.plateH/2],[s.plateW/2,-s.plateH/2],[s.plateW/2,s.plateH/2],[-s.plateW/2,s.plateH/2]];
const holes=data.polygons.map(polygon=>polygon.map(p=>{const q=transformPoint(p,data.bounds,s,s.lateralClearance*2);return[q.x,q.y];}));
addCap(triangles,outerRect,holes,s.baseThickness,true);
addCap(triangles,outerRect,[],0,false);
for(let i=0;i<4;i++){
const a=outerRect[i],b=outerRect[(i+1)%4];
addQuad(triangles,{x:a[0],y:a[1],z:0},{x:b[0],y:b[1],z:0},{x:b[0],y:b[1],z:s.baseThickness},{x:a[0],y:a[1],z:s.baseThickness});
}
for(const hole of holes){
addCap(triangles,hole,[],cavityBottom,true);
for(let i=0;i<hole.length;i++){
const a=hole[i],b=hole[(i+1)%hole.length];
addQuad(triangles,{x:a[0],y:a[1],z:cavityBottom},{x:b[0],y:b[1],z:cavityBottom},{x:b[0],y:b[1],z:s.baseThickness},{x:a[0],y:a[1],z:s.baseThickness});
}
}
for(const x of[-1,1])addBox(triangles,x*(s.plateW/2-7),0,s.baseThickness,s.pinSize,s.pinSize,s.pinHeight);
return triangles;
}

function writeBinarySTL(triangles,filename){
const buffer=new ArrayBuffer(84+triangles.length*50);
const view=new DataView(buffer);
view.setUint32(80,triangles.length,true);
let offset=84;
for(const triangle of triangles){
view.setFloat32(offset,triangle.normal.x,true);offset+=4;
view.setFloat32(offset,triangle.normal.y,true);offset+=4;
view.setFloat32(offset,triangle.normal.z,true);offset+=4;
for(const vertex of[triangle.a,triangle.b,triangle.c]){
view.setFloat32(offset,vertex.x,true);offset+=4;
view.setFloat32(offset,vertex.y,true);offset+=4;
view.setFloat32(offset,vertex.z,true);offset+=4;
}
view.setUint16(offset,0,true);offset+=2;
}
const blob=new Blob([buffer],{type:'model/stl'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;a.download=filename;a.click();
URL.revokeObjectURL(url);
}

function drawPreview(){
const canvas=$('preview');
const ctx=canvas.getContext('2d');
const scale=Math.min(canvas.width/(bounds.maxX-bounds.minX+40),canvas.height/(bounds.maxY-bounds.minY+40));
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.save();
ctx.translate(canvas.width/2,canvas.height/2);
ctx.scale(scale,scale);
ctx.translate(-(bounds.minX+bounds.maxX)/2,-(bounds.minY+bounds.maxY)/2);
ctx.strokeStyle='#7fd4ff';ctx.fillStyle='rgba(127,212,255,0.25)';ctx.lineWidth=2/scale;
for(const polygon of polygons){
ctx.beginPath();
polygon.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);});
ctx.closePath();ctx.fill();ctx.stroke();
}
ctx.restore();
}

function getSettings(){
return{plateW:+$('plateW').value,plateH:+$('plateH').value,baseThickness:+$('baseThickness').value,reliefHeight:+$('reliefHeight').value,paperThickness:+$('paperThickness').value,verticalClearance:+$('verticalClearance').value,lateralClearance:+$('lateralClearance').value,artWidth:+$('artWidth').value,pinSize:+$('pinSize').value,pinHeight:+$('pinHeight').value,align:$('align').value};
}

function generate(){
maleTriangles=[];femaleTriangles=[];
$('exportMale').disabled=true;$('exportFemale').disabled=true;
if(!polygons.length)return;
try{
const s=getSettings();
const usable=s.plateW-14-s.pinSize;
if(s.artWidth>usable)throw new Error('Riduci la larghezza del disegno sotto '+usable.toFixed(1)+' mm.');
const cavityDepth=s.paperThickness+s.verticalClearance;
maleTriangles=buildPositive({polygons,bounds},s);
femaleTriangles=buildNegative({polygons,bounds},s);
$('exportMale').disabled=false;$('exportFemale').disabled=false;
$('status').textContent='Matrici STL pronte. Cavità: '+cavityDepth.toFixed(2)+' mm. Perne: '+s.pinSize+' × '+s.pinSize+' mm, sporgenti '+s.pinHeight+' mm.';
}catch(error){
console.error(error);
$('status').textContent='Errore: '+error.message;
}
}

$('svgFile').addEventListener('change',event=>{
const file=event.target.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=e=>{
try{
const data=svgToPolygons(e.target.result);
polygons=data.polygons;bounds=data.bounds;
drawPreview();generate();
}catch(error){
console.error(error);
$('status').textContent='Errore SVG: '+error.message;
}
};
reader.readAsText(file);
});

for(const id of['plateW','plateH','baseThickness','reliefHeight','paperThickness','verticalClearance','lateralClearance','artWidth','pinSize','pinHeight','align']){
$(id).addEventListener('change',generate);
}

$('exportMale').addEventListener('click',()=>{
try{writeBinarySTL(maleTriangles,'embosser_positivo.stl');$('status').textContent='Esportato embosser_positivo.stl';}
catch(error){$('status').textContent='Errore export: '+error.message;}
});

$('exportFemale').addEventListener('click',()=>{
try{writeBinarySTL(femaleTriangles,'embosser_negativo.stl');$('status').textContent='Esportato embosser_negativo.stl';}
catch(error){$('status').textContent='Errore export: '+error.message;}
});

function resizeCanvas(){
const canvas=$('preview');
canvas.width=canvas.clientWidth;
canvas.height=canvas.clientHeight;
if(polygons.length)drawPreview();
}
addEventListener('resize',resizeCanvas);
resizeCanvas();
</script>
</body>
</html>
